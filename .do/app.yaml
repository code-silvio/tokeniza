name: tokeniza
region: nyc

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: code-silvio/tokeniza
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: CACHE_ENABLED
        scope: RUN_TIME
        value: "false"          # mude para "true" quando ativar o Redis
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${tokeniza-redis.DATABASE_URL}
      - key: AGROTOKEN_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: BEZERO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: NASDAQ_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  - name: frontend
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    github:
      repo: code-silvio/tokeniza
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: BACKEND_URL
        scope: RUN_TIME
        value: ${backend.INTERNAL_URL}
      - key: NEXT_TELEMETRY_DISABLED
        scope: BUILD_TIME
        value: "1"

# ── Redis (Managed Database) ───────────────────────────────────────────────
databases:
  - name: tokeniza-redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
